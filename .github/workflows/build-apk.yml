name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Java could not be detected"
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version is $JAVA_MAJOR (must be 17 or higher)"
            exit 1
          fi
          echo "Active Java version $JAVA_MAJOR is 17 or newer"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore could not be created"
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_TARGET="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_TARGET" ] || [ ! -s "$APK_TARGET" ]; then
            echo "Error: Target APK $APK_TARGET does not exist or is empty!"
            echo "Discovered APK files:"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          echo "APK successfully verified at $APK_TARGET"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_DIR/app-debug.apk"
          echo "asset_path=$ASSET_DIR/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: release_apk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$RELEASE_TAG" \
            "${{ steps.prepare_asset.outputs.asset_path }}" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions run number: ${{ github.run_number }}
          GitHub Actions run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}
          APK is intended for testing.
          APK is not a Play Store production release.
          APK is signed only with a temporary debug keystore." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release_apk.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$RELEASE_TAG" || true
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "DIRECT APK DOWNLOAD"
            echo "$DIRECT_URL"
            echo "### DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "$DIRECT_URL" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact app-debug-apk remains available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publishing failed or was skipped. However, if the APK build succeeded, the app-debug-apk artifact remains available."
          fi
